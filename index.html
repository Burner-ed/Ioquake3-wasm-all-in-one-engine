<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ioquake3 WASM Engine</title>
    <!-- Link your favicon.ico here -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; }
        #setup-screen { padding: 100px 20px; }
        #canvas-container { display: none; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; outline: none; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Load Quake 3 Local Files</h2>
        <p>Select your baseq3 .pk3 files (pak0.pk3, etc.) to play directly in the browser.</p>
        <input type="file" id="pk3-upload" multiple accept=".pk3">
        <br>
        <button id="start-btn" disabled>Waiting for files...</button>
    </div>

    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script>
        var Module = {
            noInitialRun: true, 
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                console.log("WASM Engine Ready. Waiting for user files.");
            }
        };

        const fileInput = document.getElementById('pk3-upload');
        const startBtn = document.getElementById('start-btn');
        let uploadedFiles = [];

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadedFiles = e.target.files;
                startBtn.disabled = false;
                startBtn.textContent = `Start Engine with ${uploadedFiles.length} file(s)`;
            }
        });

        startBtn.addEventListener('click', async () => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'block';

            try {
                FS.mkdir('/baseq3');
            } catch (e) { }

            for (let i = 0; i < uploadedFiles.length; i++) {
                const file = uploadedFiles[i];
                const arrayBuffer = await file.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                
                FS.writeFile('/baseq3/' + file.name, uint8Array);
                console.log(`Loaded: ${file.name} into VFS`);
            }

            Module.callMain([
                '+set', 'fs_basepath', '/', 
                '+set', 'fs_game', 'baseq3',
                '+map', 'q3dm1' 
            ]);
        });
    </script>
    
    <!-- Load the WASM engine matching your repo files -->
    <script src="ioquake3.js"></script>
</body>
</html>
