<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ioquake3 WASM Engine</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body { background: #111; color: #fff; margin: 0; overflow: hidden; font-family: sans-serif; }
        
      #setup-screen {padding: 50px; position: relative; z-index: 10;}
        
        /* Proper way to hide file inputs without breaking them */
        .visually-hidden {
            position: absolute !important;
            height: 1px; 
            width: 1px;
            overflow: hidden;
            clip: rect(1px, 1px, 1px, 1px);
            white-space: nowrap;
        }

        /* Style labels to look like standard buttons */
        .custom-button, #start-btn {
            display: inline-block;
            background: #333;
            color: #fff;
            padding: 8px 16px;
            margin-right: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }
        
        .custom-button:hover, #start-btn:not(:disabled):hover { background: #444; }
        #start-btn:disabled { background: #222; color: #777; cursor: not-allowed; border-color: #333; }

        #loader-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; z-index: 5; background: #050505;
        }

        #canvas-container { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            opacity: 0; z-index: 1; transition: opacity 1s ease;
        }
        canvas { width: 100%; height: 100%; outline: none; }

        /* Draggable Log Window */
        #log-window {
            position: absolute;
            top: 20px; left: 20px;
            width: 400px; height: 300px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #555;
            z-index: 20;
            display: none; /* Hidden until engine actually launches */
            flex-direction: column;
            resize: both;
            overflow: hidden;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        #log-header {
            background: #333;
            padding: 5px 10px;
            cursor: move;
            font-size: 14px;
            user-select: none;
            border-bottom: 1px solid #555;
        }
        #log-content {
            flex-grow: 1;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            color: #ddd;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Load id Tech 3 Game Files</h2>
        <p>Select a whole game folder OR individual files.</p>
        
        <input type="file" id="file-upload" class="visually-hidden" multiple>
        <input type="file" id="folder-upload" class="visually-hidden" webkitdirectory directory multiple>
        
        <label for="file-upload" class="custom-button">Choose Files</label>
        <label for="folder-upload" class="custom-button">Choose Folder</label>
        
        <br><br>
        <button id="start-btn" disabled>Waiting for files...</button>
    </div>

    <div id="log-window">
        <div id="log-header">Engine Console (Drag me)</div>
        <div id="log-content"></div>
    </div>

    <div id="loader-container"></div>

    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script>
        const logContent = document.getElementById('log-content');
        
        var Module = {
            noInitialRun: true, 
            canvas: document.getElementById('canvas'),
            
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                logContent.innerHTML += text + '<br>';
                logContent.scrollTop = logContent.scrollHeight;
            },
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                logContent.innerHTML += '<span style="color:#ff5555;">' + text + '</span><br>';
                logContent.scrollTop = logContent.scrollHeight;
            },
            onRuntimeInitialized: function() {
                Module.print("WASM Engine Ready.");
            }
        };

        // --- Drag Logic for Console Window ---
        const logWindow = document.getElementById('log-window');
        const logHeader = document.getElementById('log-header');
        let isDragging = false, startX, startY, startLeft, startTop;

        logHeader.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startLeft = logWindow.offsetLeft;
            startTop = logWindow.offsetTop;
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            logWindow.style.left = startLeft + (e.clientX - startX) + 'px';
            logWindow.style.top = startTop + (e.clientY - startY) + 'px';
        });
        document.addEventListener('mouseup', () => { isDragging = false; });

        // --- File Upload Logic ---
        const setupScreen = document.getElementById('setup-screen');
        const loaderContainer = document.getElementById('loader-container');
        const canvasContainer = document.getElementById('canvas-container');
        const startBtn = document.getElementById('start-btn');
        let uploadedFiles = [];

        function handleFileSelection(e) {
            if (e.target.files.length > 0) {
                uploadedFiles = e.target.files;
                startBtn.disabled = false;
                startBtn.textContent = `Start Engine with ${uploadedFiles.length} file(s)`;
            }
        }

        document.getElementById('file-upload').addEventListener('change', handleFileSelection);
        document.getElementById('folder-upload').addEventListener('change', handleFileSelection);

        // --- Three.js Loader Setup ---
        let scene, camera, renderer, coin;

        function init3DLoader() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            loaderContainer.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            const geometry = new THREE.CylinderGeometry(2, 2, 0.5, 64);
            const textureLoader = new THREE.TextureLoader();
            
            // NOTE: Make sure 'Id_Tech_3_logo.png' exists next to your HTML file!
            const logoTexture = textureLoader.load('Id_Tech_3_logo.png');
            logoTexture.center.set(0.5, 0.5);
            logoTexture.rotation = -Math.PI / 2;
            
            const edgeMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
            const faceMaterial = new THREE.MeshStandardMaterial({ map: logoTexture });
            const materials = [edgeMaterial, faceMaterial, faceMaterial];

            coin = new THREE.Mesh(geometry, materials);
            coin.rotation.x = Math.PI / 2;
            scene.add(coin);

            camera.position.z = 6;
            animate3D();
        }

        function animate3D() {
            if (!coin) return;
            requestAnimationFrame(animate3D);
            coin.rotation.z += 0.05; 
            renderer.render(scene, camera);
        }

        // --- Main Launch Logic ---
        startBtn.addEventListener('click', async () => {
            setupScreen.style.display = 'none';
            loaderContainer.style.display = 'block';
            
            init3DLoader();

            setTimeout(async () => {
                await loadFilesIntoVFS();
                
                setTimeout(() => {
                    loaderContainer.style.opacity = '0';
                    canvasContainer.style.opacity = '1';
                    
                    setTimeout(() => {
                        loaderContainer.style.display = 'none';
                        if(renderer) renderer.dispose();
                    }, 1000);

                    launchEngine();
                }, 5000); 

            }, 500);
        });

        async function loadFilesIntoVFS() {
            for (let i = 0; i < uploadedFiles.length; i++) {
                const file = uploadedFiles[i];
                
                // If individual files were uploaded, force them into a baseq3 folder
                const path = file.webkitRelativePath || ('baseq3/' + file.name);
                const pathParts = path.split('/');
                const fileName = pathParts.pop(); 
                
                let currentPath = '/';
                for(let part of pathParts) {
                    currentPath += part + '/';
                    try { FS.mkdir(currentPath); } catch(e) { /* Ignore if directory already exists */ }
                }

                const arrayBuffer = await file.arrayBuffer();
                FS.writeFile('/' + path, new Uint8Array(arrayBuffer));
                Module.print(`Loaded into VFS: /${path}`);
            }
        }

        function launchEngine() {
            // Show the log window exactly when the engine starts loading
            logWindow.style.display = 'flex'; 
            
            let rootFolder = 'baseq3';
            if (uploadedFiles[0].webkitRelativePath) {
                rootFolder = uploadedFiles[0].webkitRelativePath.split('/')[0];
            }

            Module.print(`Booting engine from root folder: ${rootFolder}...`);
            
            Module.callMain([
                '+set', 'fs_basepath', '/' + rootFolder,
                '+set', 'vm_game', '2', 
                '+set', 'vm_cgame', '2',
                '+set', 'vm_ui', '2',
            ]);
        }
    </script>
    
    <script src="ioquake3.js"></script>
</body>
</html>
